<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./style.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css"
    />
  </head>
  <body>
    <header class="header">
      <a class="back-link" href="../index.html">
        <img src="../arrow.png" alt="랜딩페이지로 가기 버튼" />
      </a>

      <h1 class="hero">
        <a href="./index.html">Profile</a>
      </h1>
    </header>
    <container class="chat">
      <div class="bubble-container">
        <div class="bubble-container-inner-left">
          <h2 class="white-bubble">이름?</h2>
        </div>
        <div class="bubble-container-inner-right">
          <p class="blue-bubble">곽서현</p>
        </div>
      </div>
      <div class="bubble-container">
        <div class="bubble-container-inner-left">
          <h2 class="white-bubble">나이?</h2>
        </div>
        <div class="bubble-container-inner-right">
          <p class="blue-bubble">만 23세</p>
        </div>
      </div>
      <div class="bubble-container">
        <div class="bubble-container-inner-left">
          <h2 class="white-bubble">취미?</h2>
        </div>
        <div class="bubble-container-inner-right">
          <p class="blue-bubble">음악 감상과 넷플릭스 보기</p>
        </div>
      </div>
      <div class="bubble-container">
        <div class="bubble-container-inner-left">
          <h2 class="white-bubble">MBTI?</h2>
        </div>
        <div class="bubble-container-inner-right">
          <p class="blue-bubble">ISTP</p>
        </div>
      </div>
      <div class="bubble-container">
        <div class="bubble-container-inner-left">
          <h2 class="white-bubble">좋아하는 음식과 싫어하는 음식?</h2>
        </div>
        <div class="bubble-container-inner-right">
          <p class="blue-bubble">
            일식 좋아하고 너무 달거나 매운 음식은 싫어합니다.
          </p>
        </div>
      </div>
      <div class="bubble-container">
        <div class="bubble-container-inner-left">
          <h2 class="white-bubble">
            스프린트 과정을 시작하며 간단한 너의 다짐을 말해줘
          </h2>
        </div>
        <div class="bubble-container-inner-right">
          <p class="blue-bubble">컨디션 조절 잘하며 완주하고 싶습니다</p>
        </div>
      </div>
    </container>
    <footer>
      <p><a href="./index.html">codeit-team04</a></p>
    </footer>
  </body>
</html>
